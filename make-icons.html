<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Генератор иконок для «5 букв»</title>
<style>
  body { font-family: sans-serif; padding: 24px; max-width: 520px; margin: auto; line-height: 1.5; }
  h1 { font-size: 22px; }
  button { padding: 14px 22px; font-size: 17px; margin: 6px 6px 6px 0;
           cursor: pointer; border-radius: 10px; border: 2px solid #1976d2;
           background: #fff; color: #1976d2; font-weight: 700; }
  button:active { background: #e3f2fd; }
  canvas { display: none; }
</style>
</head>
<body>
<h1>Иконки для игры «5 букв»</h1>
<p>Нажмите на обе кнопки — скачаются два файла PNG. Загрузите их на GitHub рядом с остальными файлами игры.</p>
<button id="b192">Скачать icon-192.png</button>
<button id="b512">Скачать icon-512.png</button>
<canvas id="c"></canvas>
<script>
function makeIcon(size, filename) {
  const c = document.getElementById("c");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  const r = size * 0.156;
  ctx.fillStyle = "#ffd54f";
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#222";
  ctx.font = "900 " + Math.round(size * 0.55) + "px Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("5Б", size / 2, size / 2 + size * 0.02);
  c.toBlob(function (blob) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
}
document.getElementById("b192").onclick = () => makeIcon(192, "icon-192.png");
document.getElementById("b512").onclick = () => makeIcon(512, "icon-512.png");
</script>
</body>
</html>
